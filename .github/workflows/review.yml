name: Review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/oss-cad-suite
      - uses: ./.github/actions/verible
      - uses: reviewdog/action-setup@v1
      - name: Install ruff and clang-format
        run: |
          pip install --quiet ruff
          sudo apt-get install -y -qq clang-format
      - name: Review
        run: .github/review.sh "origin/${{ github.base_ref }}" github-pr-review
      - uses: reviewdog/action-suggester@v1
        with:
          tool_name: format
          filter_mode: added
          fail_level: none
