name: OSS CAD Suite
description: Download a pinned OSS CAD Suite release and put its bin directory on the PATH

inputs:
  version:
    description: Release tag of YosysHQ/oss-cad-suite-build, for example 2026-07-24
    required: true

runs:
  using: composite
  steps:
    - name: Download and unpack the suite
      shell: bash
      run: |
        tag='${{ inputs.version }}'
        file="oss-cad-suite-linux-x64-${tag//-/}.tgz"
        url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$tag/$file"
        curl -sSfL --retry 5 --retry-all-errors "$url" -o "$RUNNER_TEMP/oss-cad-suite.tgz"
        mkdir -p "$RUNNER_TEMP/oss-cad-suite"
        tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP/oss-cad-suite" --strip-components=1
        rm -f "$RUNNER_TEMP/oss-cad-suite.tgz"
        echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
